<style>
  html{scroll-behavior:smooth}
  body{background:#F6F5F0;color:#15201B;font-family:'Inter',sans-serif}
  ::selection{background:#0E7C5B;color:#fff}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#c9c6bb;border-radius:9px}
  ::-webkit-scrollbar-track{background:transparent}
  .noscroll::-webkit-scrollbar{display:none}
  .reveal{opacity:0;transform:translateY(20px);transition:opacity .7s cubic-bezier(.2,.7,.3,1),transform .7s cubic-bezier(.2,.7,.3,1)}
  .reveal.in{opacity:1;transform:none}
  .pin{filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));transition:transform .2s}
  .pin:hover{transform:scale(1.15)}
  .upin{position:relative;width:18px;height:18px}
  .upin span{position:absolute;inset:3px;background:#0E7C5B;border:3px solid #fff;border-radius:50%;box-shadow:0 1px 6px rgba(0,0,0,.4);z-index:2}
  .upin::after{content:'';position:absolute;inset:-6px;border-radius:50%;background:rgba(14,124,91,.3);animation:pulse 1.8s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.8);opacity:0}}
  .leaflet-container{font-family:'Inter',sans-serif}
  .leaflet-popup-content-wrapper{border-radius:16px;box-shadow:0 12px 34px -10px rgba(21,32,27,.3)}
  .leaflet-popup-content{margin:14px 16px}
  .leaflet-bar{border:none!important;box-shadow:0 6px 18px -6px rgba(21,32,27,.25)!important;border-radius:10px!important;overflow:hidden}
  .leaflet-bar a{border:none!important}
  @keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
  .toast{animation:toastIn .35s cubic-bezier(.2,.8,.3,1)}
  @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .floaty{animation:floatY 5s ease-in-out infinite}
  .floaty2{animation:floatY 6.5s ease-in-out infinite;animation-delay:1.2s}
  @keyframes riseIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  .rise{opacity:0;animation:riseIn .8s cubic-bezier(.2,.7,.3,1) forwards}
  input[type=range]{accent-color:#0E7C5B}

  .chip.active{background:#0E7C5B;color:#fff;border-color:#0E7C5B}
  .leaflet-control-attribution{font-size:9px}

function makeMap(elId,center,zoom){

  maps.push(m); return m;
}

  lucide.createIcons();
}
function focusStore(id){
  const s = sid(id), m = window._expmap;
  m.flyTo([s.lat,s.lng],16,{duration:.7});
  setTimeout(()=>{ STORES.filter(x=>listHas(x)).forEach(()=>{}); m.eachLayer(l=>{ if(l.getPopup && l.getPopup() && l.getPopup().getContent().includes('>'+s.name+'<')) l.openPopup(); }); },750);
  function listHas(){return true}
}
function expCat(c){ window._exp.cat=c; refreshExp(); }
function expDist(v){ window._exp.maxD=+v; $('#dval').textContent=v+' km'; refreshExp(true); }
function expOpen(v){ window._exp.open=v; refreshExp(); }
function expOff(v){ window._exp.offs=v; refreshExp(); }
function expRate(v){ window._exp.minR=v; refreshExp(); }
function resetExp(){ location.hash='#/explore'; }
function refreshExp(keepList){
  const st = window._exp;
  const list = STORES.filter(s=>(st.cat==='All'||s.cat===st.cat)&&(!st.open||s.open)&&(!st.offs||storeOffers(s.id).length)&&dist(s)<=st.maxD&&s.rating>=st.minR).sort((a,b)=>dist(a)-dist(b));
  document.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('active', b.dataset.cat===st.cat));
  drawExpMap(list); drawExpList(list);
}
function searchArea(){
  const c = window._expmap.getCenter(), st = window._exp;
  const list = STORES.filter(s=>(st.cat==='All'||s.cat===st.cat)&&hav(c.lat,c.lng,s.lat,s.lng)<=3).sort((a,b)=>hav(c.lat,c.lng,a.lat,a.lng)-hav(c.lat,c.lng,b.lat,b.lng));
  drawExpList(list); toast(list.length+' stores found within 3 km of map center','scan-search');
}

  if(ql) results = results.filter(({p})=>p.name.toLowerCase().includes(ql)||p.cat.toLowerCase().includes(ql)||sid(l[0]).name.toLowerCase().includes(ql)||sid(l[0]).cat.toLowerCase().includes(ql));
  results.forEach(r=>r.d=dist(sid(r.l[0])), r.disc=r.l[2]?discount(r.l):0, r.rate=sid(r.l[0]).rating);
  const cmp = { nearest:(a,b)=>a.d-b.d, cheapest:(a,b)=>a.l[1]-b.l[1], rated:(a,b)=>b.rate-a.rate, offer:(a,b)=>b.disc-a.disc };

  $('#app').innerHTML = `

        <option value="rated" ${sort==='rated'?'selected':''}>Sort: Highest rated</option>

function offRedraw(){ const st=window._off;
  let list = allOffers().map((o,i)=>({...o,i})).filter(o=>{const s=sid(o.l[0]);
    return (st.cat==='All'||s.cat===st.cat||o.p.cat===st.cat)&&dist(s)<=st.maxD&&discount(o.l)>=st.minD&&o.l[1]<=st.maxP;});

    charts.push(new Chart($('#achBar'),{type:'bar',data:{labels:['Jan','Feb','Mar','Apr','May','Jun','Jul'],datasets:[{label:'New users',data:[2100,2760,3120,2980,3840,4210,4680],backgroundColor:'#0E7C5B',borderRadius:8,maxBarThickness:34}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{grid:{color:'#EFEDE6'},border:{display:false}},x:{grid:{display:false},border:{display:false}}}}}));
    const counts = S.categories.map(c=>STORES.filter(s=>s.cat===c).length).filter(v=>v);
    charts.push(new Chart($('#achDough'),{type:'doughnut',data:{labels:S.categories,datasets:[{data:counts,backgroundColor:S.categories.map(c=>catColor[c]||'#0E7C5B'),borderWidth:0,hoverOffset:8}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'66%',plugins:{legend:{position:'bottom',labels:{usePointStyle:true,boxWidth:8,padding:10,font:{size:10}}}}}}));
  }
}
function approveStore(id){
  const ps = S.pending.find(p=>p.id===id);
  STORES.push({id:STORES.length,name:ps.name,cat:ps.cat,area:ps.area.split(',')[0],address:ps.area,lat:29.96+Math.random()*.1,lng:31.22+Math.random()*.12,rating:ps.rating,rev:0,hours:'10:00 – 22:00',open:true,phone:'+20 100 000 0000',img:'new'+id,desc:'Newly verified store on SHOPER.'});
  S.pending = S.pending.filter(p=>p.id!==id); persist(); route();
  toast(`“${ps.name}” approved and is now live`,'check-check');
}
function rejectStore(id){
  const ps = S.pending.find(p=>p.id===id);
  S.pending = S.pending.filter(p=>p.id!==id); persist(); route();
  toast(`“${ps.name}” rejected — owner notified`,'x');
}

          <h1 class="font-display text-2xl font-bold">${kind==='login'?'Sign in':kind==='register'?'Create your account':'Reset password'}</h1>

            <label class="block text-xs font-semibold text-mut">Email address<input required type="email" placeholder="you@email.com" class="mt-1.5 w-full text-sm font-normal border border-stone-200 rounded-xl px-3.5 py-3 outline-none focus:border-brand-500 bg-cream"/></label>

    else if(kind==='forgot'){ toast('Password reset link sent to your email','mail-check'); location.hash='#/login'; }
    else{
      const ownerSel = document.querySelector('#roleO').classList.contains('border-brand-600');

function setRole(r){
  const c=$('#roleC'), o=$('#roleO'), f=$('#ownerFields');
  const on = r==='owner';
  c.className = c.className.replace('border-brand-600 bg-brand-50','border-stone-200 hover:border-stone-300');
  o.className = o.className.replace('border-brand-600 bg-brand-50','border-stone-200 hover:border-stone-300');
  (on?o:c).className = (on?o:c).className.replace('border-stone-200 hover:border-stone-300','border-brand-600 bg-brand-50');
  f.classList.toggle('hidden',!on);
}

/* ============================== ROUTER ============================== */
function goSearch(){ const q=$('#heroQ').value.trim(); location.hash='#/search'+(q?'?q='+encodeURIComponent(q):''); }
window.addEventListener('hashchange',route);
function route(){
  closeModal(); killMaps(); killCharts();
  const raw = location.hash.slice(2) || '';
  const [path,qs] = raw.split('?');
  const seg = path.split('/');
  const app = $('#app');
  document.documentElement.scrollTop = 0;
  if(seg[0]==='' ) pageHome();
  else if(seg[0]==='explore') pageExplore(qs);
  else if(seg[0]==='search') pageSearch(qs);
  else if(seg[0]==='offers') pageOffers(qs);
  else if(seg[0]==='compare') pageCompare(seg[1]);
  else if(seg[0]==='store') pageStore(+seg[1]);
  else if(seg[0]==='product') pageProduct(seg[1]);
  else if(seg[0]==='account') pageAccount();
  else if(seg[0]==='merchant') pageMerchant(seg[1]);
  else if(seg[0]==='admin') pageAdmin(seg[1]);
  else if(seg[0]==='login') pageAuth('login',qs);
  else if(seg[0]==='register') pageAuth('register',qs);
  else if(seg[0]==='forgot') pageAuth('forgot',qs);
  else if(seg[0]==='how'||seg[0]==='about'){ pageHome(); setTimeout(()=>{ const t=$(seg[0]==='how'?'#how':'#about'); if(t) t.scrollIntoView({behavior:'smooth'}); },80); }
  else pageHome();
  mobileNav();
  lucide.createIcons();
  observeReveal();
}
route();
</script>
